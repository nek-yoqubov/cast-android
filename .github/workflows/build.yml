name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key
        env:
          CAST_KEYSTORE_BASE64: ${{ secrets.CAST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CAST_KEYSTORE_BASE64" ]; then
            echo "::error::Secret CAST_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$CAST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "CAST_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CAST_KEYSTORE_PASSWORD: ${{ secrets.CAST_KEYSTORE_PASSWORD }}
          CAST_KEY_ALIAS: ${{ secrets.CAST_KEY_ALIAS }}
          CAST_KEY_PASSWORD: ${{ secrets.CAST_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" cast.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" cast.apk \
            --title "Cast $tag" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}. Download: cast.apk" \
            --latest
