name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Restore signing key
        env:
          CAST_KEYSTORE_BASE64: ${{ secrets.CAST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CAST_KEYSTORE_BASE64" ]; then
            echo "::error::Secret CAST_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$CAST_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "CAST_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          CAST_KEYSTORE_PASSWORD: ${{ secrets.CAST_KEYSTORE_PASSWORD }}
          CAST_KEY_ALIAS: ${{ secrets.CAST_KEY_ALIAS }}
          CAST_KEY_PASSWORD: ${{ secrets.CAST_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" cast.apk

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: cast.apk

  # Android 14 emulator: start-up, killed WebView renderer, Java crash → report screen.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/smoke-test.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-test
          path: smoke/

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          gh release create "$tag" cast.apk \
            -R "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Cast $tag" \
            --notes "Build ${{ github.run_number }} from ${GITHUB_SHA::7}. Download: cast.apk" \
            --latest
